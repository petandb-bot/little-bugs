<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7ddf3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Little Bugs">
  <meta name="description" content="Record a sound. Hatch a strange little loop.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
  <title>LITTLE BUGS · Experimental Voice Toy</title>
</head>
<body>
  <main class="app-shell">
    <header class="masthead">
      <div class="logo-line">
        <div class="logomark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div>
          <p class="eyebrow">THE POCKET SOUND MUTATOR</p>
          <h1>LITTLE<br>BUGS<span class="sparkle">✳</span></h1>
        </div>
      </div>
      <div class="version-tag">TOY/02<br><span>v0.2</span></div>
    </header>

    <section class="toy" aria-label="Little Bugs sound playground">
      <div class="toy-top">
        <span><span class="led" id="led"></span> BUG HABITAT</span>
        <span id="counter" aria-label="Created bugs">NO. 0000</span>
      </div>
      <div class="display-frame">
        <div id="visual-stage" class="visual-stage" role="img" aria-label="Animated pixel creature responding to sound"></div>
        <div class="stage-top-label"><span id="stage-label">AWAITING A VOICE</span><span>◈◈◈</span></div>
        <div class="stage-bottom-label"><span id="dna-label">? ? ? / ?.? SEC</span><span id="time-label">00:00</span></div>
        <div class="stage-overlay" aria-hidden="true"></div>
      </div>
      <div class="meter-track" aria-label="Microphone level or playback progress">
        <div class="meter-bars" id="meter-bars" aria-hidden="true"></div>
        <span class="meter-title" id="meter-title">MIC INPUT</span>
      </div>
      <div class="control-grid">
        <button id="rec-btn" class="control control-rec" type="button" aria-label="Start recording"><span class="control-icon" id="rec-icon">●</span><span id="rec-label">REC</span><small>01</small></button>
        <button id="hatch-btn" class="control control-hatch" type="button" disabled><span class="control-icon">✳</span><span>HATCH</span><small>02</small></button>
        <button id="play-btn" class="control control-play" type="button" disabled><span class="control-icon" id="play-icon">▶</span><span id="play-label">PLAY</span><small>03</small></button>
        <button id="save-btn" class="control control-save" type="button" disabled><span class="control-icon">↓</span><span>SAVE</span><small>04</small></button>
      </div>
      <div class="toy-foot">
        <span id="status" role="status" aria-live="polite">TAP REC TO BEGIN.</span>
        <span id="elapsed">MAX 12 SEC</span>
      </div>
    </section>

    <footer class="page-foot">
      <div class="instruction"><span class="asterisk">✳</span><p><strong>GIVE IT A SOUND.</strong><br>IT MAKES A STRANGE LOOP.</p></div>
      <span class="privacy">LOCAL AUDIO ONLY<br>NO UPLOADS</span>
    </footer>
  </main>
  <!-- p5.js は描画キャンバスにのみ使用し、音声処理はネイティブ Web Audio で実装。 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js" defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
